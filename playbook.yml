---
- name: Setup Cluster Apache Kafka 4.x KRaft con Sicurezza SASL_SSL (Ubuntu 26)
  hosts: kafka_cluster
  become: yes

  tasks:
    - name: Aggiorna cache APT su Ubuntu
      apt:
        update_cache: yes
        cache_valid_time: 3600
      retries: 3
      delay: 5
      register: apt_update_result
      until: apt_update_result is succeeded
      ignore_errors: yes

    - name: Installa pacchetti prerequisiti di sistema
      apt:
        name: "{{ system_packages }}"
        state: present
        update_cache: no

    - name: Includi ruolo Java (Zulu JDK 17 LTS confinata all'utente {{ kafka_user }})
      include_role:
        name: java

    - name: Includi ruolo Kafka 4.x (KRaft combined + TLS + SASL/PLAIN + ACL)
      include_role:
        name: kafka

    - name: Verifica stato servizio systemd Kafka
      systemd:
        name: kafka
        state: started
      register: kafka_status

    - name: Verifica stato del quorum KRaft (dal primo nodo)
      become: yes
      become_user: "{{ kafka_user }}"
      environment:
        JAVA_HOME: "{{ java_home }}"
        PATH: "{{ java_home }}/bin:{{ kafka_home }}/bin:/usr/local/bin:/usr/bin:/bin"
      shell: |
        BS="{% for host in groups['kafka_cluster'] %}{{ hostvars[host]['ansible_host'] }}:{{ kafka_broker_port }}{% if not loop.last %},{% endif %}{% endfor %}"
        {{ kafka_home }}/bin/kafka-metadata-quorum.sh --bootstrap-server "$BS" \
          --command-config "{{ kafka_client_properties }}" describe --status
      register: kraft_quorum_status
      changed_when: false
      when: inventory_hostname == groups['kafka_cluster'][0]
      run_once: true

    - name: Mostra stato del Quorum KRaft
      debug:
        var: kraft_quorum_status.stdout_lines
      when: inventory_hostname == groups['kafka_cluster'][0]
      run_once: true

    - name: Mostra riepilogo installazione per nodo
      debug:
        msg:
          - "Nodo: {{ inventory_hostname }} ({{ ansible_host }})"
          - "KRaft Node ID: {{ kafka_node_id }} (Ruoli: {{ kafka_process_roles }})"
          - "Servizio Kafka: {{ kafka_status.status.ActiveState }}"
          - "Java confinata: {{ java_home }} (in ~/.bashrc e ~/.profile di {{ kafka_user }})"
          - "Data dir: {{ kafka_data_dir }}"
          - "Security dir: {{ kafka_security_dir }}"
