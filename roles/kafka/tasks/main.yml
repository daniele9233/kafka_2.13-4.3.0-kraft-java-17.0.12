- name: Crea script wrapper generico per tutti i comandi Kafka
  copy:
    content: |
      #!/bin/bash
      # Wrapper generico per eseguire qualsiasi comando Kafka con Java configurato
      export JAVA_HOME={{ java_home }}
      export PATH=$JAVA_HOME/bin:$PATH
      export KAFKA_HOME={{ kafka_home }}
      
      if [ $# -eq 0 ]; then
        echo "Usage: kafka-run <command> [args...]"
        echo "Example: kafka-run kafka-topics.sh --list --bootstrap-server localhost:9092"
        exit 1
      fi
      
      exec {{ kafka_home }}/bin/"$@"
    dest: /usr/local/bin/kafka-run
    mode: '0755'
    owner: root
    group: root

- name: Mostra comandi wrapper disponibili
  debug:
    msg:
      - "=========================================="
      - "WRAPPER KAFKA INSTALLATI CON SUCCESSO"
      - "=========================================="
      - ""
      - "Comandi disponibili da qualsiasi utente:"
      - "  - kafka-topics"
      - "  - kafka-console-producer"
      - "  - kafka-console-consumer"
      - "  - kafka-broker-api-versions"
      - "  - kafka-consumer-groups"
      - "  - kafka-configs"
      - "  - kafka-acls"
      - "  - kafka-log-dirs"
      - "  - kafka-reassign-partitions"
      - "  - kafka-leader-election"
      - "  - kafka-run (wrapper generico)"
      - ""
      - "Esempi d'uso:"
      - "  kafka-topics --list --bootstrap-server {{ ansible_host }}:9092"
      - "  kafka-topics --describe --topic test --bootstrap-server {{ ansible_host }}:9092"
      - "  kafka-console-producer --topic test --bootstrap-server {{ ansible_host }}:9092"
      - "  kafka-console-consumer --topic test --from-beginning --bootstrap-server {{ ansible_host }}:9092"
      - ""
      - "Per comandi non wrappati, usa:"
      - "  kafka-run <nome-script.sh> [args]"
      - "=========================================="

- name: Crea client SSL properties corrette
  copy:
    content: |
      security.protocol=SSL
      ssl.truststore.location={{ kafka_home }}/config/certs/kafka.server.truststore.jks
      ssl.truststore.password={{ ssl_truststore_password }}
      ssl.keystore.location={{ kafka_home }}/config/certs/kafka.server.keystore.jks
      ssl.keystore.password={{ ssl_keystore_password }}
      ssl.key.password={{ ssl_key_password }}
      ssl.endpoint.identification.algorithm=
    dest: "{{ kafka_home }}/config/client-ssl.properties"
    owner: kafka
    group: kafka
    mode: '0644'
