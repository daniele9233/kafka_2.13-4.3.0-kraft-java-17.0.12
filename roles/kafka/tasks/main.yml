---
- name: Crea utente kafka
  user:
    name: kafka
    system: yes
    shell: /bin/false
    home: "{{ kafka_home }}"

- name: Crea directory per Kafka
  file:
    path: "{{ item }}"
    state: directory
    owner: kafka
    group: kafka
    mode: '0755'
  loop:
    - "{{ kafka_home }}"
    - "{{ kafka_log_dirs }}"
    - "{{ kafka_home }}/logs"
    - "{{ kafka_home }}/config/certs"

- name: Verifica se Kafka è già installato
  stat:
    path: "{{ kafka_home }}/bin/kafka-server-start.sh"
  register: kafka_installed

- name: Scarica Kafka
  get_url:
    url: "{{ kafka_url }}"
    dest: "/tmp/{{ kafka_archive }}"
    timeout: 300
  when: not kafka_installed.stat.exists

- name: Estrai Kafka
  unarchive:
    src: "/tmp/{{ kafka_archive }}"
    dest: "{{ kafka_home }}"
    remote_src: yes
    extra_opts: ['--strip-components=1']
    owner: kafka
    group: kafka
  when: not kafka_installed.stat.exists

- name: Genera certificati SSL per TLS
  include_tasks: ssl_certificates.yml
  when: ssl_enabled

- name: Configura broker ID
  set_fact:
    kafka_broker_id: "{{ zookeeper_id }}"

- name: Configura server.properties
  template:
    src: server.properties.j2
    dest: "{{ kafka_home }}/config/server.properties"
    owner: kafka
    group: kafka
    mode: '0644'
  notify: restart kafka

- name: Crea systemd service per Kafka
  template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: '0644'
  notify: restart kafka

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Abilita e avvia Kafka
  systemd:
    name: kafka
    enabled: yes
    state: started

- name: Attendi che Kafka sia pronto sulla porta SSL
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ kafka_port }}"
    delay: 10
    timeout: 60
    state: started

- name: Attendi che Kafka sia pronto sulla porta PLAINTEXT
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ kafka_plaintext_port }}"
    delay: 5
    timeout: 30
    state: started

- name: Verifica stato finale Kafka
  systemd:
    name: kafka
  register: kafka_final_status

- name: Mostra stato finale Kafka
  debug:
    msg:
      - "Kafka Broker ID: {{ kafka_broker_id }}"
      - "Stato: {{ kafka_final_status.status.ActiveState }}"
      - "Listening SSL: {{ ansible_host }}:{{ kafka_port }}"
      - "Listening PLAINTEXT: {{ ansible_host }}:{{ kafka_plaintext_port }}"

# ========================================
# WRAPPER SCRIPTS PER COMANDI KAFKA
# ========================================

- name: Crea script wrapper kafka-topics
  copy:
    content: |
      #!/bin/bash
      export JAVA_HOME={{ java_home }}
      export PATH=$JAVA_HOME/bin:$PATH
      exec {{ kafka_home }}/bin/kafka-topics.sh "$@"
    dest: /usr/local/bin/kafka-topics
    mode: '0755'
    owner: root
    group: root

