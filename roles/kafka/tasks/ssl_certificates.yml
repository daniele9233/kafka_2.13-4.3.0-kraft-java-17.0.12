---
# ==============================================================================
# CERTIFICATI TLS: CA interna, Truststore condiviso e Keystore JKS per nodo
# Riferimento: Sez. 4 di Guida_Kafka_KRaft_3_Nodi_SASL_SSL_v3.pdf
# ==============================================================================

- name: Crea directory sicurezza {{ kafka_security_dir }} su tutti i nodi
  file:
    path: "{{ kafka_security_dir }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0750'

- name: Crea directory temporanea sul controller Ansible per distribuzione certificati
  file:
    path: "{{ ssl_controller_tmp_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: no
  run_once: true

# ------------------------------------------------------------------------------
# 4.1 Crea la CA (Certificate Authority) sul primo nodo (kafka-1)
# ------------------------------------------------------------------------------
- name: Genera la CA interna (ca.key e ca.crt) sul primo nodo
  shell: |
    openssl req -new -newkey rsa:{{ ssl_ca_key_size }} -days {{ ssl_validity_days }} -x509 \
      -subj "/CN={{ ssl_ca_cn }}" \
      -keyout ca.key -out ca.crt -nodes
    chmod 600 ca.key
    chmod 644 ca.crt
  args:
    chdir: "{{ kafka_security_dir }}"
    creates: "{{ kafka_security_dir }}/ca.crt"
  when: inventory_hostname == groups['kafka_cluster'][0]
  run_once: true

# ------------------------------------------------------------------------------
# 4.2 Crea il Truststore (uguale per tutti i nodi) sul primo nodo
# ------------------------------------------------------------------------------
- name: Crea il Truststore condiviso ({{ ssl_truststore_filename }}) sul primo nodo
  shell: |
    {{ java_home }}/bin/keytool -keystore {{ ssl_truststore_filename }} -alias {{ ssl_ca_alias }} \
      -import -file ca.crt -storepass '{{ ssl_truststore_password }}' -noprompt
  args:
    chdir: "{{ kafka_security_dir }}"
    creates: "{{ kafka_security_dir }}/{{ ssl_truststore_filename }}"
  when: inventory_hostname == groups['kafka_cluster'][0]
  run_once: true

# ------------------------------------------------------------------------------
# 4.3 Genera i Keystore per tutti e 3 i Nodi sul primo nodo
# ------------------------------------------------------------------------------
- name: Genera e firma il Keystore per ciascun nodo del cluster sul primo nodo
  shell: |
    set -e
    IP="{{ hostvars[item]['ansible_host'] }}"
    HOST="{{ item }}"
    KS="kafka-${IP}.keystore.jks"

    # 1. Genera keystore e chiave privata
    {{ java_home }}/bin/keytool -genkey -keystore "${KS}" -alias {{ ssl_keystore_alias }} \
      -validity {{ ssl_validity_days }} -keyalg RSA -keysize {{ ssl_keystore_key_size }} \
      -storepass '{{ ssl_keystore_password }}' -keypass '{{ ssl_key_password }}' \
      -dname "CN=${IP}" -ext "SAN=IP:${IP},DNS:${HOST},DNS:localhost,IP:127.0.0.1"

    # 2. Crea richiesta di firma (CSR)
    {{ java_home }}/bin/keytool -keystore "${KS}" -alias {{ ssl_keystore_alias }} \
      -certreq -file "cert-file-${IP}" -storepass '{{ ssl_keystore_password }}'

    # 3. Firma il certificato con la CA includendo SAN=IP:<ip>
    printf "subjectAltName=IP:%s,DNS:%s,DNS:localhost,IP:127.0.0.1\n" "${IP}" "${HOST}" > "ext-${IP}.cnf"
    openssl x509 -req -CA ca.crt -CAkey ca.key -in "cert-file-${IP}" \
      -out "cert-signed-${IP}" -days {{ ssl_validity_days }} -CAcreateserial \
      -extfile "ext-${IP}.cnf"

    # 4. Importa CA nel keystore
    {{ java_home }}/bin/keytool -keystore "${KS}" -alias {{ ssl_ca_alias }} \
      -import -file ca.crt -storepass '{{ ssl_keystore_password }}' -noprompt

    # 5. Importa certificato firmato nel keystore
    {{ java_home }}/bin/keytool -keystore "${KS}" -alias {{ ssl_keystore_alias }} \
      -import -file "cert-signed-${IP}" -storepass '{{ ssl_keystore_password }}' -noprompt

    # Pulisci file CSR/temporanei
    rm -f "cert-file-${IP}" "cert-signed-${IP}" "ext-${IP}.cnf"
  args:
    chdir: "{{ kafka_security_dir }}"
    creates: "{{ kafka_security_dir }}/kafka-{{ hostvars[item]['ansible_host'] }}.keystore.jks"
  loop: "{{ groups['kafka_cluster'] }}"
  when: inventory_hostname == groups['kafka_cluster'][0]
  run_once: true

# ------------------------------------------------------------------------------
# 4.4 Distribuzione di Keystore e Truststore agli altri nodi
# ------------------------------------------------------------------------------
- name: Preleva Truststore e CA cert dal primo nodo verso il controller Ansible
  fetch:
    src: "{{ kafka_security_dir }}/{{ item }}"
    dest: "{{ ssl_controller_tmp_dir }}/{{ item }}"
    flat: yes
  loop:
    - "{{ ssl_truststore_filename }}"
    - "ca.crt"
  when: inventory_hostname == groups['kafka_cluster'][0]
  run_once: true

- name: Preleva i Keystore di tutti i nodi dal primo nodo verso il controller Ansible
  fetch:
    src: "{{ kafka_security_dir }}/kafka-{{ hostvars[item]['ansible_host'] }}.keystore.jks"
    dest: "{{ ssl_controller_tmp_dir }}/kafka-{{ hostvars[item]['ansible_host'] }}.keystore.jks"
    flat: yes
  loop: "{{ groups['kafka_cluster'] }}"
  when: inventory_hostname == groups['kafka_cluster'][0]
  run_once: true

- name: Copia il Truststore condiviso e ca.crt sugli altri nodi
  copy:
    src: "{{ ssl_controller_tmp_dir }}/{{ item }}"
    dest: "{{ kafka_security_dir }}/{{ item }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0600'
  loop:
    - "{{ ssl_truststore_filename }}"
    - "ca.crt"
  when: inventory_hostname != groups['kafka_cluster'][0]

- name: Copia il Keystore specifico del nodo ({{ ssl_keystore_filename }}) sugli altri nodi
  copy:
    src: "{{ ssl_controller_tmp_dir }}/{{ ssl_keystore_filename }}"
    dest: "{{ ssl_keystore_location }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0600'
  when: inventory_hostname != groups['kafka_cluster'][0]

- name: Imposta proprietario e permessi 0600 sui file .jks su tutti i nodi
  file:
    path: "{{ item }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0600'
  loop:
    - "{{ ssl_keystore_location }}"
    - "{{ ssl_truststore_location }}"

- name: Imposta permessi 0600 su ca.key sul primo nodo
  file:
    path: "{{ kafka_security_dir }}/ca.key"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0600'
  when: inventory_hostname == groups['kafka_cluster'][0]

- name: Imposta proprietario {{ kafka_user }}:{{ kafka_group }} su {{ kafka_security_dir }}
  file:
    path: "{{ kafka_security_dir }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    recurse: yes

- name: Rimuovi directory temporanea certificati dal controller Ansible
  file:
    path: "{{ ssl_controller_tmp_dir }}"
    state: absent
  delegate_to: localhost
  become: no
  run_once: true

- name: Verifica SAN e validità del Keystore sul nodo corrente
  shell: |
    {{ java_home }}/bin/keytool -list -v -keystore "{{ ssl_keystore_location }}" \
      -storepass '{{ ssl_keystore_password }}' | grep -A 3 "SubjectAlternativeName"
  register: cert_san_info
  changed_when: false

- name: Mostra dettagli SAN del certificato installato
  debug:
    msg:
      - "Nodo: {{ inventory_hostname }} ({{ ansible_host }})"
      - "Keystore: {{ ssl_keystore_location }}"
      - "SAN: {{ cert_san_info.stdout_lines }}"
