---
- name: Crea directory per Java
  file:
    path: "{{ java_home }}"
    state: directory
    mode: '0755'

- name: Verifica se Java è già installato
  stat:
    path: "{{ java_home }}/bin/java"
  register: java_installed

- name: Scarica Zulu JDK 17
  get_url:
    url: "{{ java_url }}"
    dest: "/tmp/{{ java_archive }}"
    timeout: 300
  when: not java_installed.stat.exists

- name: Estrai Zulu JDK 17 direttamente nella directory corretta
  unarchive:
    src: "/tmp/{{ java_archive }}"
    dest: "{{ java_home }}"
    remote_src: yes
    extra_opts: ['--strip-components=1']
    owner: root
    group: root
  when: not java_installed.stat.exists

- name: Verifica che Java esista dopo estrazione
  stat:
    path: "{{ java_home }}/bin/java"
  register: java_check

- name: Mostra errore se Java non è stato estratto
  fail:
    msg: "Java non è stato estratto correttamente in {{ java_home }}"
  when: not java_check.stat.exists

- name: Configura JAVA_HOME nel profilo di sistema
  lineinfile:
    path: /etc/profile.d/java.sh
    line: "{{ item }}"
    create: yes
    mode: '0644'
  loop:
    - "export JAVA_HOME={{ java_home }}"
    - "export PATH=$JAVA_HOME/bin:$PATH"

- name: Verifica installazione Java
  shell: "{{ java_home }}/bin/java -version"
  register: java_version_output
  changed_when: false

- name: Mostra versione Java
  debug:
    var: java_version_output.stderr_lines
